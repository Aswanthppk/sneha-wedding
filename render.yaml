services:
  - type: web
    name: wedding-invitation
    env: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        value: sneha@2026
      - key: GOOGLE_SHEET_WEBHOOK_URL
        sync: false
